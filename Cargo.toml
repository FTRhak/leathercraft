[package]
name = "leathercraft"
version = "0.1.0"
edition = "2024"
description = "A desktop CAD-style leather pattern editor"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "leathercraft"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:bevy", "dep:bevy_egui", "dep:dirs", "dep:earcutr", "dep:rfd", "dep:sys-locale"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "0.18.1", optional = true }
bevy_egui = { version = "0.39.1", optional = true }
dirs = { version = "6", optional = true }
earcutr = { version = "0.4", optional = true }
rfd = { version = "0.15", optional = true }
sys-locale = { version = "0.3", optional = true }
